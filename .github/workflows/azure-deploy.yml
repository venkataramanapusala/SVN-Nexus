name: Deploy to Azure Web App

# Trigger the workflow on every push to main, or manually
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: svnnexus          # Actual Azure Web App resource name (matches publish profile's msdeploySite)
  AZURE_WEBAPP_PACKAGE_PATH: '.'        # Path to the site content to deploy

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Package the static site (HTML, CSS, JS) together with the Node
      #    server that Azure App Service uses to actually serve it.
      #    Including package.json lets Azure's Oryx build system auto-detect
      #    a Node app and run `npm start` on deploy, without requiring a
      #    manually configured startup command in the Azure Portal.
      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r index.html style.css script.js README.md package.json server.js deploy/ 2>/dev/null || true

      # 3. Deploy to Azure Web App using the publish profile stored in secrets
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/deploy
